// betterbird.cfg -- loads home/thunderbird/.config/tbkeys/*.js into every tbkeys-bound window
try {
  const bound_window_types = ["mail:3pane", "msgcompose"];

  // Dependency order: core/selection/folders come first so later modules can
  // rely on their primitives; whichkey loads last and fires the initial repaint.
  const MODULE_MANIFEST = [
    "core.js",
    "selection.js",
    "folders.js",
    "motions.js",
    "navigation.js",
    "actions.js",
    "search.js",
    "ui.js",
    "whichkey.js",
  ];

  const tbkeys_dir = () => {
    const dir = Services.dirsvc.get("Home", Components.interfaces.nsIFile);
    dir.append(".config");
    dir.append("tbkeys");
    return dir;
  };

  const load_helpers = (win) => {
    try {
      const windowtype = win.document?.documentElement?.getAttribute("windowtype");
      if (!bound_window_types.includes(windowtype)) return;

      const dir = tbkeys_dir();

      for (const name of MODULE_MANIFEST) {
        const file = dir.clone();
        file.append(name);
        if (!file.exists()) {
          Services.console.logStringMessage(
            `tbkeys helpers: ${file.path} not found, keybinding helpers not loaded`
          );
          return;
        }

        try {
          Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(file).spec, {
            target: win,
            allowUnsafeURL: true,
          });
        } catch (e) {
          Components.utils.reportError(`tbkeys helpers: ${name} failed to load: ${e}`);
          return;
        }
      }
    } catch (e) {
      Components.utils.reportError(`tbkeys helpers failed to load: ${e}`);
    }
  };

  const window_observer = {
    observe(win) {
      win.addEventListener("load", () => load_helpers(win), { once: true });
    },
  };

  Services.obs.addObserver(window_observer, "domwindowopened");
} catch (e) {
  Components.utils.reportError(`tbkeys autoconfig failed: ${e}`);
}
