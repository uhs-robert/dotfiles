// betterbird.cfg -- loads home/thunderbird/.config/tbkeys/helpers.js into every tbkeys-bound
// window, and pushes the tracked home/thunderbird/.config/tbkeys/keys.json into the tbkeys
// add-on's own storage so its Options page never needs a manual paste.
try {
  const bound_window_types = ["mail:3pane", "msgcompose"];
  const TBKEYS_ID = "tbkeys@addons.thunderbird.net";

  const config_file = (name) => {
    const file = Services.dirsvc.get("Home", Components.interfaces.nsIFile);
    file.append(".config");
    file.append("tbkeys");
    file.append(name);
    return file;
  };

  const read_file = (file) => {
    const stream = Components.classes["@mozilla.org/network/file-input-stream;1"].createInstance(
      Components.interfaces.nsIFileInputStream
    );
    stream.init(file, -1, 0, 0);
    const converter = Components.classes[
      "@mozilla.org/intl/converter-input-stream;1"
    ].createInstance(Components.interfaces.nsIConverterInputStream);
    converter.init(stream, "UTF-8", 0, 0);
    try {
      let content = "";
      const out = {};
      while (converter.readString(4096, out) !== 0) content += out.value;
      return content;
    } finally {
      converter.close();
    }
  };

  // tbkeys' background page keeps its keybinding logic in ordinary top-level
  // vars (window.browser, window.applyKeys); reached via the xulBrowser +
  // wrappedJSObject route so it can be driven exactly like the Options page
  // drives it, with no private storage backend to reverse-engineer.
  const get_tbkeys_background_window = () => {
    const policy = WebExtensionPolicy.getByID(TBKEYS_ID);
    const extension = policy?.extension;
    if (!extension) return null;
    for (const view of extension.views ?? []) {
      if (view.viewType === "background" && view.xulBrowser?.contentWindow) {
        return view.xulBrowser.contentWindow.wrappedJSObject;
      }
    }
    return null;
  };

  const load_helpers = (win) => {
    try {
      const windowtype = win.document?.documentElement?.getAttribute("windowtype");
      if (!bound_window_types.includes(windowtype)) return;

      const file = config_file("helpers.js");
      if (!file.exists()) {
        Services.console.logStringMessage(
          `tbkeys helpers: ${file.path} not found, keybinding helpers not loaded`
        );
        return;
      }

      Services.scriptloader.loadSubScriptWithOptions(Services.io.newFileURI(file).spec, {
        target: win,
        allowUnsafeURL: true,
      });
    } catch (e) {
      Components.utils.reportError(`tbkeys helpers failed to load: ${e}`);
    }
  };

  // Retried per window-open (not just once) because the tbkeys background
  // page may not be ready yet on the very first window. Compares against
  // tbkeys' own live storage (not a separate pref) so a reinstalled add-on
  // or a manually-changed setting is still picked up correctly.
  const sync_tbkeys_keys = async () => {
    try {
      const file = config_file("keys.json");
      if (!file.exists()) return;
      const content = read_file(file);
      JSON.parse(content);

      const bg_window = get_tbkeys_background_window();
      if (
        !bg_window?.browser?.storage?.local?.get ||
        !bg_window?.browser?.storage?.local?.set ||
        typeof bg_window.applyKeys !== "function"
      ) {
        return;
      }

      const stored = await bg_window.browser.storage.local.get("mainkeys");
      if (stored?.mainkeys === content) return;

      await bg_window.browser.storage.local.set({ mainkeys: content });
      await bg_window.applyKeys();
    } catch (e) {
      Components.utils.reportError(`tbkeys keys.json sync failed: ${e}`);
    }
  };

  const window_observer = {
    observe(win) {
      win.addEventListener(
        "load",
        () => {
          load_helpers(win);
          sync_tbkeys_keys();
        },
        { once: true }
      );
    },
  };

  Services.obs.addObserver(window_observer, "domwindowopened");
} catch (e) {
  Components.utils.reportError(`tbkeys autoconfig failed: ${e}`);
}
